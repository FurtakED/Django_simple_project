{% extends 'base.html' %}

{% block title %}Words{% endblock %}

{% block content %}
    <h2>Words</h2>
    <table>
        <tr>
            <th>English</th>
            <th>Translation</th>
            <th>Lesson</th>
        </tr>
        {% for word in words %}
            <tr>
                <td>{{ word.english_word }}</td>
                <td>{{ word.translation }}</td>
                <td>{{ word.lesson.name }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="3">No words yet.</td></tr>
        {% endfor %}
    </table>
{% endblock %}
